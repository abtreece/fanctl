# fanctl configuration — temperature-based BMC fan control for Dell PowerEdge.
#
# All fields are optional; omitted fields fall back to the built-in defaults
# shown here. Defaults target a Dell 12G/13G host (R420/R430-class).

# ipmitool binary (name on PATH or absolute path).
ipmitool: ipmitool

# How fanctl reaches the BMC. The default is in-band (local /dev/ipmi0). To
# control a remote host's BMC instead, use out-of-band lanplus. Keep the
# password out of the file by referencing an environment variable, which the
# loader expands (e.g. set IPMI_PASSWORD in the systemd unit's environment).
# connection:
#   interface: lanplus       # "open" (default, in-band) or "lanplus"
#   host: 10.0.0.5
#   username: admin
#   password: ${IPMI_PASSWORD}

# How often to re-read temperatures and adjust fans.
poll_interval: 30s

# Downward hysteresis in °C: the controller only steps to a cooler/quieter band
# once the temperature has fallen this far below the lower band's ceiling. Stops
# the fans hunting at a boundary.
hysteresis: 4

# Which temperature sensors drive the curve. If `ids` is set it wins; otherwise
# a sensor is selected when its name contains any `name_match` substring and
# none of `name_exclude` (case-insensitive). The default picks the CPU sensors
# on most Dell generations. Run `fanctl doctor` to see what your host exposes,
# or pin exact SDR record ids, e.g.:
#   ids: ["0Eh", "0Fh"]
sensors:
  name_match: ["Temp"]
  name_exclude: ["Inlet", "Exhaust"]

# Optional Prometheus metrics endpoint. Empty (default) disables it. When set,
# fanctl serves /metrics and /healthz on this address (host:port).
# metrics:
#   listen: ":9466"

# Factor NVIDIA GPU temperature into the curve, for hosts with passively-cooled
# datacenter GPUs (e.g. a Tesla T4) that rely on chassis airflow. fanctl drives
# the curve off max(hottest CPU sensor, hottest GPU). IMPORTANT: when enabled and
# nvidia-smi cannot be read, fanctl fails safe to BMC automatic control rather
# than cooling on CPU data alone. On a GPU host, set the curve's top band where
# you want the BMC to take over (the T4 throttles around 89°C), e.g. raise the
# upper bands and hand back to auto by ~80°C.
# gpu:
#   enabled: true
#   command: nvidia-smi

# Fan curve: ascending temperature ceilings (°C) -> fan duty percent. A
# temperature above the hottest band hands control back to the BMC's automatic
# thermal management, which is always the safe fallback.
curve:
  - max_temp: 50
    percent: 10
  - max_temp: 60
    percent: 20
  - max_temp: 68
    percent: 30
  - max_temp: 75
    percent: 45
