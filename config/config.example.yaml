# fanctl configuration — temperature-based BMC fan control for Dell PowerEdge.
#
# All fields are optional; omitted fields fall back to the built-in defaults
# shown here. Defaults target a Dell 12G/13G host (R420/R430-class).

# ipmitool binary (name on PATH or absolute path).
ipmitool: ipmitool

# How fanctl reaches the BMC. The default is in-band (local /dev/ipmi0). To
# control a remote host's BMC instead, use out-of-band lanplus. Keep the
# password out of the file by referencing an environment variable, which the
# loader expands (e.g. set IPMI_PASSWORD in the systemd unit's environment).
# connection:
#   interface: lanplus       # "open" (default, in-band) or "lanplus"
#   host: 10.0.0.5
#   username: admin
#   password: ${IPMI_PASSWORD}

# How often to re-read temperatures and adjust fans.
poll_interval: 30s

# Optional faster cadence used while the system is hot (commanded duty >=
# hot_duty) or temperature is rising >= 1°C/min. 0 (default) disables adaptive
# polling and poll_interval is used throughout.
# poll_interval_hot: 5s
# hot_duty: 50

# Deadline for one control iteration's BMC I/O. A wedged ipmitool (a busy iDRAC,
# or a stalled lanplus connection) must never block the loop indefinitely, since
# that would leave the fans pinned at the last commanded duty with no path back
# to BMC automatic control. Capped at the shortest poll cadence in play. Raise it
# for a slow BMC — and raise WatchdogSec in the systemd unit to match. Changing
# this needs a restart, not a reload.
step_timeout: 15s

# Hysteresis in °C: after handing control to the BMC on over-temp, manual
# control is only reclaimed once the temperature has fallen this far below the
# curve's top anchor, which stops flapping at the handoff boundary.
hysteresis: 4

# Deadband in percent points: small downward duty wobble is held to avoid
# hunting and IPMI churn. Increases always apply immediately.
deadband: 3

# Predictive lookahead in minutes: the curve is evaluated at
# temp + slope * lookahead, so a fast temperature rise gets airflow early
# instead of the fans chasing it. The boost is capped at 8°C and never
# negative. 0 disables prediction.
lookahead: 1.5

# Re-issue the manual-control commands this often even when the duty is
# unchanged, recovering from an iDRAC that silently reverted to automatic
# control (e.g. after a BMC reset). 0 disables.
reassert_interval: 5m

# Which temperature sensors drive the curve. If `ids` is set it wins; otherwise
# a sensor is selected when its name contains any `name_match` substring and
# none of `name_exclude` (case-insensitive). The default picks the CPU sensors
# on most Dell generations. Run `fanctl doctor` to see what your host exposes,
# or pin exact SDR record ids, e.g.:
#   ids: ["0Eh", "0Fh"]
sensors:
  name_match: ["Temp"]
  name_exclude: ["Inlet", "Exhaust"]

# Optional Prometheus metrics endpoint. Empty (default) disables it. When set,
# fanctl serves /metrics and /healthz on this address (host:port).
# metrics:
#   listen: ":9466"

# Factor NVIDIA GPU temperature into the control loop, for hosts with
# passively-cooled datacenter GPUs (e.g. a Tesla T4) that rely on chassis
# airflow. With a gpu.curve, fanctl computes a duty per source (CPU curve vs
# GPU curve) and commands the maximum, so each device gets the airflow it
# needs; without one the GPU shares the main curve. IMPORTANT: when enabled
# and nvidia-smi cannot be read, fanctl fails safe to BMC automatic control
# rather than cooling on CPU data alone. Keep the GPU curve's top anchor just
# under the card's throttle point (the T4 throttles around 89°C).
# gpu:
#   enabled: true
#   command: nvidia-smi
#   curve:
#     - max_temp: 55
#       percent: 20
#     - max_temp: 70
#       percent: 50
#     - max_temp: 78
#       percent: 70
#     - max_temp: 85
#       percent: 100

# Fan curve: ascending temperature anchors (°C) -> fan duty percent. Duty is
# linearly interpolated between anchors. A temperature above the hottest
# anchor hands control back to the BMC's automatic thermal management, which
# is always the safe fallback.
curve:
  - max_temp: 50
    percent: 10
  - max_temp: 60
    percent: 20
  - max_temp: 68
    percent: 30
  - max_temp: 75
    percent: 45
